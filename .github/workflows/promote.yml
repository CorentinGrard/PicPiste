name: Promote

# Run from the Actions tab once the internal test version has been checked on a phone:
# the same build (same version code, same notes) goes to the next track.
on:
  workflow_dispatch:
    inputs:
      to:
        description: Publish to
        type: choice
        options: [alpha]
        default: alpha
      dry_run:
        description: Only show what would be promoted
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Internal test to ${{ inputs.to }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 -I scripts/play.py promote --from internal --to "${{ inputs.to }}" ${{ inputs.dry_run && '--dry-run' || '' }}
