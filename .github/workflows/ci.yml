name: CI

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # to publish releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK platform 37.2
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" > /dev/null

      - name: Core tests
        run: ./gradlew :core:test --console=plain

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PICPISTE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/picpiste.jks"
            echo "PICPISTE_KEYSTORE=$RUNNER_TEMP/picpiste.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key (pull request from a fork?): the APK uses a throwaway debug key."
          fi

      - name: Build APK
        env:
          PICPISTE_KEYSTORE_PASSWORD: ${{ secrets.PICPISTE_KEYSTORE_PASSWORD }}
          PICPISTE_KEY_ALIAS: ${{ secrets.PICPISTE_KEY_ALIAS }}
          PICPISTE_KEY_PASSWORD: ${{ secrets.PICPISTE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VERSION="0.1-${GITHUB_SHA::7}"
          ./gradlew :app:assembleRelease --console=plain -PversionCode=${{ github.run_number }} -PversionName="$VERSION"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PicPiste-$VERSION.apk"

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests/test

      - uses: actions/upload-artifact@v4
        with:
          name: PicPiste-apk
          path: dist/*.apk

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "PicPiste $GITHUB_REF_NAME" --generate-notes
