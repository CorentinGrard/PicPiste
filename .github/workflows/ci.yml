name: CI

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # to publish releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Play Store upload only once the service account key is set up (see docs/PLAY_STORE.md).
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK platform 37.2
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" > /dev/null

      - name: Core tests
        run: ./gradlew :core:test --console=plain

      # Fresh OGN device database in the app; keeps the committed copy if OGN is unreachable.
      - name: OGN device database
        run: ./gradlew :core:updateDdb --console=plain

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PICPISTE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/picpiste.jks"
            echo "PICPISTE_KEYSTORE=$RUNNER_TEMP/picpiste.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key (pull request from a fork?): the APK uses a throwaway debug key."
          fi

      - name: Build APK
        env:
          PICPISTE_KEYSTORE_PASSWORD: ${{ secrets.PICPISTE_KEYSTORE_PASSWORD }}
          PICPISTE_KEY_ALIAS: ${{ secrets.PICPISTE_KEY_ALIAS }}
          PICPISTE_KEY_PASSWORD: ${{ secrets.PICPISTE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VERSION="0.1-${GITHUB_SHA::7}"
          ./gradlew :app:assembleRelease --console=plain -PversionCode=${{ github.run_number }} -PversionName="$VERSION"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PicPiste-$VERSION.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Play Store bundle: same version as the APK.
      - name: Build Play Store bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PICPISTE_KEYSTORE_PASSWORD: ${{ secrets.PICPISTE_KEYSTORE_PASSWORD }}
          PICPISTE_KEY_ALIAS: ${{ secrets.PICPISTE_KEY_ALIAS }}
          PICPISTE_KEY_PASSWORD: ${{ secrets.PICPISTE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease --console=plain -PversionCode=${{ github.run_number }} -PversionName="$VERSION"
          cp app/build/outputs/bundle/release/app-release.aab "dist/PicPiste-$VERSION-play.aab"

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests/test

      - uses: actions/upload-artifact@v4
        with:
          name: PicPiste-apk
          path: dist/*

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "PicPiste $GITHUB_REF_NAME" --generate-notes

      # Tagged versions go to the Play Store internal test (no review, minutes), notes from
      # distribution/whatsnew. Once checked, the "Promote" workflow moves the same build on.
      - name: Play Store internal test
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fr.cvvm.picpiste
          releaseFiles: dist/PicPiste-${{ env.VERSION }}-play.aab
          releaseName: ${{ github.run_number }} (${{ env.VERSION }})
          track: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew
